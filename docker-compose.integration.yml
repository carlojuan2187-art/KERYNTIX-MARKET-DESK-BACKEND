# Local integration harness only. MongoDB/Redis ports bind to localhost and have no auth.
# Never reuse this file as a production deployment.
services:
  mongodb:
    image: mongo:7.0
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend-integration-tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      FTRADE_ENV: test
      FTRADE_INTEGRATION: "1"
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      DATABASE_NAME: ftrade_web_integration
      MONGODB_TIMEOUT_MS: "5000"
      REDIS_URL: redis://redis:6379/0
      FTRADE_DEPLOYMENT_NAME: integration-test
      PAYMENT_TXS_COLLECTION: integration_payment_txs
      PAYMENTS_COLLECTION: integration_payments
      REFERRALS_COLLECTION: integration_referrals
      REFERRAL_REWARDS_COLLECTION: integration_referral_rewards
      SUPPORT_TICKETS_COLLECTION: integration_support_tickets
      ADMIN_AUDIT_COLLECTION: integration_admin_audit
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-q", "tests/integration", "--disable-warnings"]
